services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse-postgres:/var/lib/postgresql/data

  api:
    image: node:24-alpine
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql://warehouse:warehouse@postgres:5432/warehouse
      API_PORT: 3001
    volumes:
      - .:/workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @warehouse/api dev"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  warehouse-postgres:
